[project]
name = "context-extension-and-long-context-eval"
version = "0.1.0"
description = "RoPE scaling by hand - position interpolation, NTK-aware, YaRN - evaluated with something better than needle-in-a-haystack."
requires-python = ">=3.11"
# NumPy only. The RoPE and scaling analysis, both task generators, the test
# suite and scripts/generate_results.py all run on this alone -- which is what
# lets CI regenerate results/ without downloading a model.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.14.3"]
# Only scripts/run_eval.py needs these, and only when re-running inference.
# Kept out of `dev` so the CI drift gate does not pull a torch wheel.
eval = ["torch>=2.2", "transformers>=4.40"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
# Declared so `uv sync` can install the project itself. Without it the project
# is unbuildable, uv skips it, and the declared dependencies are never
# installed -- which passes locally where they happen to be present and fails
# on a clean CI runner.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_extension_and_long_context_eval"]
