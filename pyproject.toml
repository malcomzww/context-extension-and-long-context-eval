[project]
name = "context-extension-and-long-context-eval"
version = "0.1.0"
description = "RoPE scaling by hand - position interpolation, NTK-aware, YaRN - evaluated with something better than needle-in-a-haystack."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
