name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest -q

      # The committed results here depend on a model download and on the
      # host's own hardware, so a runner cannot reproduce the values and
      # diffing them would fail the build for a reason the author cannot fix.
      # What CI can still check is that the generator RUNS -- which catches a
      # broken script, the failure the gate actually exists to catch.
      - name: Results generator still runs
        working-directory: context-extension-and-long-context-eval
        run: |
          if [ -f scripts/generate_results.py ]; then
            uv run python scripts/generate_results.py ||               (echo "generate_results.py failed to run" && exit 1)
            git diff --stat results/ || true
          fi
